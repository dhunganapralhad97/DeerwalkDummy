<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Industry-focused IT and programming courses in Nepal: web development, data science, AI, cyber security and more.">
  <title>Contact | Deerwalk Training Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="content">

    <section class="container page split">
      <div>
        <h1>Contact us</h1>
        <p>Questions about a course, schedule or fees? Call us or send a message.</p>
        <ul class="plain" id="phones"></ul>
      </div>
      <form class="form" id="contact-form">
        <label class="field"><span class="field__label">Name</span><input name="name" required autocomplete="name"></label>
        <label class="field"><span class="field__label">Email</span><input name="email" type="email" required autocomplete="email"></label>
        <label class="field"><span class="field__label">Phone (optional)</span><input name="phone" type="tel" autocomplete="tel"></label>
        <label class="field"><span class="field__label">Subject</span><input name="subject"></label>
        <label class="field"><span class="field__label">Message</span><textarea name="message" rows="5" maxlength="2000" required></textarea></label>
        <p id="form-status" role="status" hidden></p>
        <button class="btn">Send message</button>
      </form>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

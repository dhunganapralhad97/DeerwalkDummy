<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Industry-focused IT and programming courses in Nepal: web development, data science, AI, cyber security and more.">
  <title>Courses | Deerwalk Training Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="courses">
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="content">

    <section class="container page">
      <h1 id="courses-title">All courses</h1>
      <div class="filters">
        <input type="search" id="q" placeholder="Search courses" aria-label="Search courses">
        <select id="category" aria-label="Category"></select>
        <label class="check"><input type="checkbox" id="upcoming"> Upcoming only</label>
      </div>
      <p id="courses-empty" hidden>No courses match these filters. Try a different search or category.</p>
      <div class="grid" id="courses-grid"></div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
